- defaults:
    link:
      create: true
      force: true
      relink: true

- clean: ["~"]

- link:
    # Directories
    ~/.config/aerospace: .config/aerospace
    ~/.config/bash: .config/bash
    ~/.config/borders: .config/borders
    ~/.config/btop: .config/btop
    ~/.config/fastfetch: .config/fastfetch
    ~/.config/fish: .config/fish
    ~/.config/gh: .config/gh
    ~/.config/mise: .config/mise
    ~/.config/nvim: .config/nvim
    ~/.config/opencode: .config/opencode
    ~/.config/rex: .config/rex
    ~/.config/zed: .config/zed
    ~/.agents/skills/health: .config/agents/skills/health # Codex, Pi and OpenCode
    ~/.claude/CLAUDE.md: .config/claude/CLAUDE.md
    ~/.claude/skills/health: .config/agents/skills/health
    ~/.claude/settings.json: .config/claude/settings.json
    ~/.codex/AGENTS.md: .config/codex/AGENTS.md
    ~/.codex/config.toml: .config/codex/config.toml
    ~/.codex/rules/destructive.rules: .config/codex/rules/destructive.rules
    ~/.codex/skills/use-github-cli: .config/codex/skills/use-github-cli
    ~/.pi/agent/AGENTS.md: .config/pi/agent/AGENTS.md
    ~/.pi/agent/keybindings.json: .config/pi/agent/keybindings.json
    ~/.pi/agent/settings.json: .config/pi/agent/settings.json

    # Files
    ~/.bashrc: .config/bash/.bashrc
    ~/.config/starship.toml: .config/starship/starship.toml
    ~/.gitconfig: .config/git/.gitconfig
    ~/.tmux.conf: .config/tmux/.tmux.conf
    "~/Library/Application Support/lazygit/config.yml": .config/lazygit/config.yml

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [
        git config filter.codex-state.clean scripts/strip-codex-state && git config filter.codex-state.smudge cat && git config filter.pi-state.clean scripts/strip-pi-state && git config filter.pi-state.smudge cat,
        Keep Codex trust entries and app-written state out of commits,
      ]
    - [
        brew bundle check --file=.config/homebrew/Brewfile >/dev/null || brew bundle install --no-upgrade --file=.config/homebrew/Brewfile,
        Installing Homebrew packages,
      ]
