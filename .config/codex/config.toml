# Mirrors the autoMode environment and rules in ~/.claude/settings.json.
[auto_review]
extra_policy = '''
## Environment
- Personal macOS laptop (mba15) with one user. Source control is github.com/maxpetretta; pushing to those repos and opening PRs on them is routine.
- Development lives in ~/dev. ~/Documents holds personal files and research notes; copying them into repos or off the machine needs the user to name the source and destination.
- memo (~/.local/share/memo, ~/.memo) and its com.max.* LaunchAgents are the user's own local tools, not production. Sending memo data off the machine is exfiltration.
- Agents get no secrets: never print, copy, or send tokens, SSH keys, or ~/.config/gh contents.
- Local git commits on any branch are routine.

## Deny unless the user's message asks for this exact action
- Merging into main or master by any route: `gh pr merge`, the GitHub API or web UI, or a local merge or rebase onto main or master followed by a push.
- Force-pushing or rewriting history on main or master: `--force`, `-f`, `--force-with-lease`, a `+main` or `+master` refspec, or deleting and recreating the branch.
- Permanently deleting files that existed before the task. Use `trash`.
'''

