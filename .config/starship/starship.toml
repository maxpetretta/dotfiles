"$schema" = 'https://starship.rs/config-schema.json'

format = """
$all\
$hostname\
$line_break\
$character"""

[hostname]
ssh_only = true
format = "via [$hostname]($style) "
style = "yellow"

[directory]
read_only = " 󰌾"
style = "bold blue"

[git_branch]
symbol = " "
style = "bold green"

[sudo]
symbol = "root"
style = "bold red"
disabled = false

[username]
disabled = true
