[tools]
usage = "latest"
node = "22.23.1"
# Memo's Claude hooks and Codex MCP server call these installs by path; keep them in step.
bun = "1.3.14"
python = "3.13"
# Pinned to OpenCode V2 2.2.5, for the built-in Claude Agent provider (2.2.3 and later). Publisher
# checked on 2026-11-03: thdxr, anomalyco/opencode, published from GitHub Actions. aube skips the
# package's postinstall, which links the platform binary, so run it by hand after installing.
"npm:@opencode/cli" = { version = "2.2.5", allow_low_downloads = true }

[env]
# Keep the pinned OpenCode V2 from self-updating.
OPENCODE_DISABLE_AUTOUPDATE = "1"
