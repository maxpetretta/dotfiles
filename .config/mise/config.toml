[tools]
usage = "latest"
node = "22.23.1"
bun = "1.3.2"
"npm:@rynfar/meridian" = "latest"
# Pinned: Meridian only qualifies OpenCode V2 2.0.16. Approved past minimumPackageAge after
# verifying the publisher (thdxr, anomalyco/opencode) on 2026-10-02.
"npm:@opencode/cli" = { version = "2.0.16", allow_low_downloads = true }

[env]
# Keep the pinned OpenCode V2 from self-updating past Meridian's qualified version.
OPENCODE_DISABLE_AUTOUPDATE = "1"
