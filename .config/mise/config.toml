[tools]
usage = "latest"
node = "22.23.1"
# Memo's Claude hooks and Codex MCP server call these installs by path; keep them in step.
bun = "1.3.14"
python = "3.13"
# Pinned to OpenCode V2 2.0.16. Approved past minimumPackageAge after verifying the publisher
# (thdxr, anomalyco/opencode) on 2026-10-02.
"npm:@opencode/cli" = { version = "2.0.16", allow_low_downloads = true }

[env]
# Keep the pinned OpenCode V2 from self-updating.
OPENCODE_DISABLE_AUTOUPDATE = "1"
